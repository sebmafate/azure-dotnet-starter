name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restauration
        run: dotnet restore

      - name: Compilation (warnings bloquants)
        run: dotnet build --no-restore -warnaserror

      - name: Tests unitaires et d'intégration
        run: dotnet test --no-build --logger "trx;LogFileName=results.trx"

      - name: Validation Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
